name: Daily incremental refresh

on:
  schedule:
    # Off the top of the hour (GitHub delays :00 crons more under load).
    # Primary: ~04:17 UTC = 06:17 CEST / 05:17 CET
    - cron: "17 4 * * 1-6"   # Mon–Sat incremental
    - cron: "17 4 * * 0"     # Sunday full
    # Catch-up if the morning run was delayed past useful time:
    # ~08:17 UTC = 10:17 CEST / 09:17 CET
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode"
        type: choice
        options:
          - incremental
          - full
        default: incremental
      lookback_days:
        description: "Lookback days for incremental mode"
        type: string
        default: "2"

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Choose refresh mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            # Only the Sunday primary slot is full; catch-up stays incremental.
            if [ "${{ github.event.schedule }}" = "17 4 * * 0" ]; then
              MODE=full
            else
              MODE=incremental
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "lookback=${{ github.event.inputs.lookback_days || '2' }}" >> "$GITHUB_OUTPUT"

      # Tenants run as separate steps so one HAL outage does not skip the other,
      # and successful artifacts can still be committed below.
      - name: Refresh UniCA
        id: unica
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            hal-unica refresh --full
          else
            hal-unica refresh --lookback-days "${{ steps.mode.outputs.lookback }}"
          fi

      - name: Refresh UBE
        id: ube
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            hal-unica refresh --university ube --full
          else
            hal-unica refresh --university ube --lookback-days "${{ steps.mode.outputs.lookback }}"
          fi

      # One automatic retry for tenants that timed out talking to HAL/DataCite.
      - name: Retry failed refreshes
        id: retry
        if: always() && !cancelled() && (steps.unica.outcome == 'failure' || steps.ube.outcome == 'failure')
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 30
          MODE="${{ steps.mode.outputs.mode }}"
          LOOKBACK="${{ steps.mode.outputs.lookback }}"
          UNICA_OK=0
          UBE_OK=0
          if [ "${{ steps.unica.outcome }}" = "failure" ]; then
            echo "Retrying UniCA…"
            if [ "$MODE" = "full" ]; then
              hal-unica refresh --full && UNICA_OK=1 || UNICA_OK=0
            else
              hal-unica refresh --lookback-days "$LOOKBACK" && UNICA_OK=1 || UNICA_OK=0
            fi
          else
            UNICA_OK=1
          fi
          if [ "${{ steps.ube.outcome }}" = "failure" ]; then
            echo "Retrying UBE…"
            if [ "$MODE" = "full" ]; then
              hal-unica refresh --university ube --full && UBE_OK=1 || UBE_OK=0
            else
              hal-unica refresh --university ube --lookback-days "$LOOKBACK" && UBE_OK=1 || UBE_OK=0
            fi
          else
            UBE_OK=1
          fi
          echo "unica_ok=$UNICA_OK" >> "$GITHUB_OUTPUT"
          echo "ube_ok=$UBE_OK" >> "$GITHUB_OUTPUT"
          if [ "$UNICA_OK" != 1 ] || [ "$UBE_OK" != 1 ]; then
            echo "Retry still incomplete (unica_ok=$UNICA_OK ube_ok=$UBE_OK)"
            exit 1
          fi

      - name: Commit and push site + census
        id: commit
        if: always() && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/census \
            data/unica_data_repo_links.jsonl \
            data/unica_data_repo_links.jsonl.summary.json \
            data/ube \
            docs \
            logs/census.log \
            logs/ube-census.log || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily HAL incremental refresh ($(date -u +%Y-%m-%d))"
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if any university refresh failed
        if: always() && !cancelled()
        run: |
          UNICA="${{ steps.unica.outcome }}"
          UBE="${{ steps.ube.outcome }}"
          RETRY_UNICA="${{ steps.retry.outputs.unica_ok }}"
          RETRY_UBE="${{ steps.retry.outputs.ube_ok }}"
          # Success if first attempt OK, or retry reported OK for that tenant.
          ok_unica=0
          ok_ube=0
          if [ "$UNICA" = "success" ] || [ "$RETRY_UNICA" = "1" ]; then ok_unica=1; fi
          if [ "$UBE" = "success" ] || [ "$RETRY_UBE" = "1" ]; then ok_ube=1; fi
          echo "unica first=$UNICA retry=$RETRY_UNICA → $ok_unica"
          echo "ube first=$UBE retry=$RETRY_UBE → $ok_ube"
          if [ "$ok_unica" != 1 ] || [ "$ok_ube" != 1 ]; then
            echo "::error::One or more university refreshes failed after retry"
            exit 1
          fi

  # GITHUB_TOKEN pushes do not trigger pages.yml — deploy here when docs changed.
  # Run even if a tenant refresh ultimately failed, as long as something was committed.
  deploy-pages:
    needs: refresh
    if: always() && !cancelled() && needs.refresh.outputs.has_changes == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
