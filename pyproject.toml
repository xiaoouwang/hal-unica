[project]
name = "hal-unica"
version = "0.1.0"
description = "Harvest Université Côte d'Azur metadata from HAL (latest version only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
]

[project.scripts]
hal-unica = "hal_unica.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
