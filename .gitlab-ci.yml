# Huma-Num GitLab (gitlab.huma-num.fr) — Pages + optional scheduled refresh.
#
# Live site (after Pages is enabled on the project):
#   https://mshs-sud-est.gitpages.huma-num.fr/hal-unica/
#
# Enable: Settings → Pages, and (for refresh) CI/CD schedules + job-token push
# permissions if you want the scheduled job to commit census updates.

stages:
  - refresh
  - pages

variables:
  GIT_STRATEGY: fetch
  HAL_UNICA_SITE_BASE_URL: "https://mshs-sud-est.gitpages.huma-num.fr/hal-unica"
  HAL_UNICA_SOURCE_REPO_URL: "https://gitlab.huma-num.fr/mshs-sud-est/hal-unica"
  # GitHub remains the canonical source for day-to-day refresh; this job is a
  # Huma-Num mirror path when schedules are enabled.
  LOOKBACK_DAYS: "2"

# ---------------------------------------------------------------------------
# Optional: incremental HAL refresh (schedule or manual). Needs outbound HTTPS
# to api.archives-ouvertes.fr / api.datacite.org and permission to push.
# ---------------------------------------------------------------------------
.refresh_template:
  stage: refresh
  tags:
    - alpine
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git gcc musl-dev libffi-dev
    - python -m pip install --upgrade pip
    - pip install -e .
    - git config user.name "hal-unica-ci"
    - git config user.email "ci@gitlab.huma-num.fr"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      set -euo pipefail
      MODE="${REFRESH_MODE:-incremental}"
      if [ "$MODE" = "full" ]; then
        hal-unica refresh --full
        hal-unica refresh --university ube --full
      else
        hal-unica refresh --lookback-days "${LOOKBACK_DAYS}"
        hal-unica refresh --university ube --lookback-days "${LOOKBACK_DAYS}"
      fi
      git add data/census data/unica_data_repo_links.jsonl data/unica_data_repo_links.jsonl.summary.json data/ube docs logs/census.log logs/ube-census.log || true
      if git diff --staged --quiet; then
        echo "No census changes to commit."
      else
        git commit -m "Daily HAL incremental refresh ($(date -u +%Y-%m-%d))"
        git push origin "HEAD:${CI_COMMIT_REF_NAME}"
      fi
  allow_failure: true

refresh:scheduled:
  extends: .refresh_template
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

refresh:manual:
  extends: .refresh_template
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "api"
      when: manual

# ---------------------------------------------------------------------------
# GitLab Pages — publish docs/ under gitpages.huma-num.fr
# Rewrites absolute GitHub URLs in the artifact only (repo on disk unchanged).
# ---------------------------------------------------------------------------
pages:
  stage: pages
  tags:
    - alpine
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp -a docs/. public/
    - |
      set -euo pipefail
      GH_SITE="https://xiaoouwang.github.io/hal-unica"
      GH_REPO="https://github.com/xiaoouwang/hal-unica"
      find public \( -name '*.html' -o -name '*.xml' -o -name 'robots.txt' \) -print0 \
        | xargs -0 sed -i \
            -e "s|${GH_SITE}|${HAL_UNICA_SITE_BASE_URL}|g" \
            -e "s|${GH_REPO}|${HAL_UNICA_SOURCE_REPO_URL}|g"
    - test -f public/index.html
    - echo "Pages artifact ready → ${HAL_UNICA_SITE_BASE_URL}/"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
